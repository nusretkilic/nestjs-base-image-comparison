
name: Docker Benchmark CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Docker image benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
      TRIVY_VERSION: 0.69.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y jq curl python3-reportlab

          curl -sfL \
            "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"

          docker --version
          node --version
          npm --version
          trivy --version

      - name: Collect environment metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p result/raw

          {
            echo "Benchmark date (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Git commit: $(git rev-parse HEAD)"
            echo "Git branch: ${GITHUB_REF_NAME}"
            echo "Runner OS: ${RUNNER_OS}"
            echo "Runner architecture: $(uname -m)"
            echo "Docker platform: linux/amd64"
            echo "Node version: $(node --version)"
            echo "NPM version: $(npm --version)"
            echo
            echo "Docker version:"
            docker --version
            echo
            echo "Trivy version:"
            trivy --version
          } | tee result/raw/environment.txt

      - name: Download Trivy vulnerability database
        shell: bash
        run: |
          set -euo pipefail

          trivy image --download-db-only

      - name: Resolve and pull base images
        shell: bash
        run: |
          set -euo pipefail

          get_arg_value() {
            local dockerfile="$1"
            local arg_name="$2"

            awk -v wanted="$arg_name" '
              $1 == "ARG" {
                name = $2
                sub(/=.*/, "", name)

                if (name == wanted) {
                  value = $2
                  sub(/^[^=]*=/, "", value)
                  print value
                  exit
                }
              }
            ' "$dockerfile"
          }

          base_images_file="$(mktemp)"
          trap 'rm -f "$base_images_file"' EXIT

          for dockerfile in products-api/Dockerfile.*; do
            echo "Reading $dockerfile"

            node_image="$(get_arg_value "$dockerfile" NODE_IMAGE)"
            runtime_image="$(get_arg_value "$dockerfile" RUNTIME_IMAGE)"

            if [[ -n "$node_image" ]]; then
              echo "$node_image" >> "$base_images_file"
            fi

            if [[ -n "$runtime_image" ]]; then
              echo "$runtime_image" >> "$base_images_file"
            fi
          done

          sort -u "$base_images_file" -o "$base_images_file"

          while IFS= read -r image; do
            [[ -z "$image" ]] && continue

            echo "Pulling linux/amd64 base image: $image"

            docker pull \
              --platform linux/amd64 \
              "$image"
          done < "$base_images_file"

          cp "$base_images_file" result/raw/base-images.txt

      - name: Scan runtime base images
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p result/raw/base-scans

          get_arg_value() {
            local dockerfile="$1"
            local arg_name="$2"

            awk -v wanted="$arg_name" '
              $1 == "ARG" {
                name = $2
                sub(/=.*/, "", name)

                if (name == wanted) {
                  value = $2
                  sub(/^[^=]*=/, "", value)
                  print value
                  exit
                }
              }
            ' "$dockerfile"
          }

          for dockerfile in products-api/Dockerfile.*; do
            variant="${dockerfile##*.}"

            node_image="$(get_arg_value "$dockerfile" NODE_IMAGE)"
            runtime_image="$(get_arg_value "$dockerfile" RUNTIME_IMAGE)"

            if [[ -n "$runtime_image" ]]; then
              base_image="$runtime_image"
            else
              base_image="$node_image"
            fi

            if [[ -z "$base_image" ]]; then
              echo "ERROR: Could not resolve runtime base image for $variant"
              exit 1
            fi

            echo "Scanning runtime base image for $variant: $base_image"

            trivy image \
              --scanners vuln \
              --format json \
              --output "result/raw/base-scans/${variant}.json" \
              "$base_image"

            # Ensure that an OS package scan was actually performed.
            jq -e '
              [.Results[]? | select(.Class == "os-pkgs")]
              | length > 0
            ' "result/raw/base-scans/${variant}.json" >/dev/null
          done

      - name: Scan production npm dependencies
        shell: bash
        run: |
          set -euo pipefail

          npm_dir="result/raw/npm-production"

          mkdir -p "$npm_dir"

          cp products-api/package.json "$npm_dir/package.json"
          cp products-api/package-lock.json "$npm_dir/package-lock.json"

          echo "Generating production-only npm lockfile"

          (
            cd "$npm_dir"

            npm install \
              --package-lock-only \
              --omit=dev \
              --ignore-scripts \
              --no-audit \
              --no-fund
          )

          # Check that the generated lockfile contains package entries.
          jq -e '
            (.packages | type == "object")
            and
            ([.packages | keys[] | select(. != "")] | length > 0)
          ' "$npm_dir/package-lock.json" >/dev/null

          echo "Scanning production npm dependencies"

          trivy fs \
            --scanners vuln \
            --format json \
            --output result/raw/npm-production.json \
            "$npm_dir"

          # Do not report zero vulnerabilities if Trivy failed to detect
          # the npm dependency ecosystem.
          jq -e '
            [
              .Results[]?
              | select(
                  .Class == "lang-pkgs"
                  and .Type == "node-pkg"
                )
            ]
            | length > 0
          ' result/raw/npm-production.json >/dev/null

          echo "Production npm scan completed and validated."

      - name: Build, scan and inspect images
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p result/raw/final-scans
          mkdir -p result/raw/build-times
          mkdir -p result/raw/inspection

          variants=(alpine debian slim distroless)

          for variant in "${variants[@]}"; do
            dockerfile="products-api/Dockerfile.${variant}"
            image="products-api:${variant}"

            echo "========================================"
            echo "Benchmarking: $variant"
            echo "========================================"

            # Build three times without cache.
            for run in 1 2 3; do
              echo "Build $run/3: $variant"

              /usr/bin/time \
                -f "%e" \
                -o "result/raw/build-times/${variant}-${run}.txt" \
                docker build \
                  --platform linux/amd64 \
                  --no-cache \
                  --pull=false \
                  --file "$dockerfile" \
                  --tag "$image" \
                  products-api
            done

            median_time="$(
              cat "result/raw/build-times/${variant}-"*.txt \
                | sort -n \
                | sed -n '2p'
            )"

            echo "$median_time" \
              > "result/raw/build-times/${variant}-median.txt"

            # Scan final image.
            echo "Scanning final image: $image"

            trivy image \
              --scanners vuln \
              --format json \
              --output "result/raw/final-scans/${variant}.json" \
              "$image"

            # Validate OS scan results.
            jq -e '
              [.Results[]? | select(.Class == "os-pkgs")]
              | length > 0
            ' "result/raw/final-scans/${variant}.json" >/dev/null

            # Smoke test.
            case "$variant" in
              alpine) port=3101 ;;
              debian) port=3102 ;;
              slim) port=3103 ;;
              distroless) port=3104 ;;
              *)
                echo "Unknown variant: $variant"
                exit 1
                ;;
            esac

            bash scripts/smoke-test.sh "$image" "$port"

            # Export runtime filesystem.
            container="inspect-${variant}-${GITHUB_RUN_ID}"
            filesystem_tar="$(mktemp)"

            cleanup_inspection() {
              docker rm -f "$container" >/dev/null 2>&1 || true
              rm -f "$filesystem_tar"
            }

            trap cleanup_inspection EXIT

            docker create \
              --platform linux/amd64 \
              --name "$container" \
              "$image" >/dev/null

            docker export "$container" > "$filesystem_tar"

            tar -tvf "$filesystem_tar" \
              > "result/raw/inspection/${variant}-filesystem-details.txt"

            tar -tf "$filesystem_tar" \
              > "result/raw/inspection/${variant}-filesystem.txt"

            # Inspect actual executable files and executable symlinks.
            python3 - \
              "$filesystem_tar" \
              "result/raw/inspection/${variant}-executables.txt" <<'PY'
          import posixpath
          import sys
          import tarfile

          archive_path = sys.argv[1]
          output_path = sys.argv[2]

          with tarfile.open(archive_path, "r:*") as archive:
              members = {}

              for member in archive.getmembers():
                  name = member.name.lstrip("./")
                  if name:
                      members[name] = member

              def is_executable(name, visited=None):
                  if visited is None:
                      visited = set()

                  name = posixpath.normpath(name.lstrip("/"))

                  if name in visited or name not in members:
                      return False

                  visited.add(name)
                  member = members[name]

                  if member.isfile():
                      return bool(member.mode & 0o111)

                  if member.issym() or member.islnk():
                      target = member.linkname

                      if target.startswith("/"):
                          target = target.lstrip("/")
                      elif member.issym():
                          target = posixpath.join(
                              posixpath.dirname(name),
                              target
                          )

                      return is_executable(target, visited)

                  return False

              executables = set()

              for name, member in members.items():
                  if member.isfile() and member.mode & 0o111:
                      executables.add(posixpath.basename(name))

                  elif member.issym() or member.islnk():
                      if is_executable(name):
                          executables.add(posixpath.basename(name))

              with open(output_path, "w", encoding="utf-8") as output:
                  for executable in sorted(executables):
                      output.write(executable + "\n")
          PY

            docker rm "$container" >/dev/null
            rm -f "$filesystem_tar"
            trap - EXIT

            executables="result/raw/inspection/${variant}-executables.txt"

            has_executable() {
              local name="$1"
              grep -Fxq "$name" "$executables"
            }

            {
              echo "Variant: $variant"

              if has_executable "sh" \
                || has_executable "ash" \
                || has_executable "dash" \
                || has_executable "bash" \
                || has_executable "busybox"; then
                echo "Shell: yes"
              else
                echo "Shell: no"
              fi

              if has_executable "bash"; then
                echo "Bash: yes"
              else
                echo "Bash: no"
              fi

              if has_executable "apk" \
                || has_executable "apt" \
                || has_executable "apt-get" \
                || has_executable "dpkg" \
                || has_executable "yum" \
                || has_executable "microdnf" \
                || has_executable "dnf" \
                || has_executable "zypper" \
                || has_executable "pacman"; then
                echo "Package manager: yes"
              else
                echo "Package manager: no"
              fi

              debug_tools=()

              for tool in curl wget busybox ping; do
                if has_executable "$tool"; then
                  debug_tools+=("$tool")
                fi
              done

              if [[ ${#debug_tools[@]} -gt 0 ]]; then
                echo "Debug tools: ${debug_tools[*]}"
              else
                echo "Debug tools: none detected"
              fi

            } > "result/raw/inspection/${variant}-usability.txt"

            # Docker image size: uncompressed layer size.
            docker image inspect "$image" \
              --format '{{.Size}}' \
              > "result/raw/inspection/${variant}-size-bytes.txt"

            # Record image metadata.
            {
              echo "Image: $image"
              echo "Platform: linux/amd64"
              echo "Image ID:"
              docker image inspect "$image" --format '{{.Id}}'
              echo "Repo digests:"
              docker image inspect "$image" \
                --format '{{join .RepoDigests ";"}}'
              echo "Image size (uncompressed bytes):"
              cat "result/raw/inspection/${variant}-size-bytes.txt"
            } > "result/raw/inspection/${variant}-metadata.txt"

            # Record Node version.
            if [[ "$variant" == "distroless" ]]; then
              node_binary="/nodejs/bin/node"
            else
              node_binary="/usr/local/bin/node"
            fi

            docker run --rm \
              --platform linux/amd64 \
              --entrypoint "$node_binary" \
              "$image" \
              --version \
              > "result/raw/inspection/${variant}-node-version.txt"

            echo "Completed: $variant"
          done

      - name: Validate all vulnerability scan outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          variants=(alpine debian slim distroless)

          for variant in "${variants[@]}"; do
            base_file="result/raw/base-scans/${variant}.json"
            final_file="result/raw/final-scans/${variant}.json"

            test -s "$base_file"
            test -s "$final_file"

            jq -e '
              [.Results[]? | select(.Class == "os-pkgs")]
              | length > 0
            ' "$base_file" >/dev/null

            jq -e '
              [.Results[]? | select(.Class == "os-pkgs")]
              | length > 0
            ' "$final_file" >/dev/null

            echo "Validated OS scans: $variant"
          done

          jq -e '
            [
              .Results[]?
              | select(
                  .Class == "lang-pkgs"
                  and .Type == "node-pkg"
                )
            ]
            | length > 0
          ' result/raw/npm-production.json >/dev/null

          echo "All OS and npm vulnerability scans validated."

      - name: Generate benchmark reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p result

          variants=(alpine debian slim distroless)
          severities=(CRITICAL HIGH MEDIUM LOW UNKNOWN)

          count_scan() {
            local file="$1"
            local package_class="$2"
            local severity="$3"
            local fix_status="$4"

            if [[ ! -f "$file" ]]; then
              echo "N/A"
              return
            fi

            jq -r \
              --arg package_class "$package_class" \
              --arg severity "$severity" \
              --arg fix_status "$fix_status" '
                [
                  .Results[]? as $result
                  | $result.Vulnerabilities[]?
                  | select(
                      if $package_class == "os" then
                        $result.Class == "os-pkgs"
                      elif $package_class == "npm" then
                        $result.Class == "lang-pkgs"
                        and $result.Type == "node-pkg"
                      else
                        true
                      end
                    )
                  | select(
                      if $severity == "ALL" then
                        true
                      else
                        ((.Severity // "UNKNOWN") | ascii_upcase) == $severity
                      end
                    )
                  | select(
                      if $fix_status == "fix_available" then
                        ((.FixedVersion // "") != "")
                      elif $fix_status == "no_fix_available" then
                        ((.FixedVersion // "") == "")
                      else
                        true
                      end
                    )
                  | {
                      id: (.VulnerabilityID // "UNKNOWN"),
                      package: (.PkgName // "UNKNOWN")
                    }
                ]
                | unique_by([.id, .package])
                | length
              ' "$file"
          }

          {
            echo "# Docker Image Benchmark Report"
            echo
            echo "## 1. Benchmark information"
            echo
            echo "- Date (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "- Commit: $(git rev-parse HEAD)"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Platform: linux/amd64"
            echo "- Docker: $(docker --version)"
            echo "- Node used for lockfile processing: $(node --version)"
            echo "- Trivy: $(trivy --version | head -n 1)"
            echo
            echo "## 2. Methodology"
            echo
            echo "- Four variants: Alpine, Debian, Slim and Distroless."
            echo "- The application source code and dependency lockfile are shared."
            echo "- Base image references are pinned by digest."
            echo "- Runtime base images are scanned separately from final images."
            echo "- Production npm dependencies are scanned from a production-only lockfile."
            echo "- Development dependencies are excluded from the npm scan."
            echo "- npm scan output is validated to ensure Trivy detects node-pkg results."
            echo "- Each image is built three times with Docker build cache disabled."
            echo "- The median of the three build times is reported."
            echo "- Base images are pulled before build timing begins."
            echo "- Every final image is smoke-tested."
            echo "- Unit and E2E tests are run locally before pushing, not in this workflow."
            echo
            echo "## 3. Image sizes and build times"
            echo
            echo "Docker image size is the uncompressed image layer size reported by Docker, not compressed registry download size."
            echo
            echo "| Variant | Image size (bytes) | Image size (MB) | Median build time (seconds) |"
            echo "|---|---:|---:|---:|"

            for variant in "${variants[@]}"; do
              size_file="result/raw/inspection/${variant}-size-bytes.txt"
              time_file="result/raw/build-times/${variant}-median.txt"

              size="N/A"
              build_time="N/A"
              size_mb="N/A"

              if [[ -f "$size_file" ]]; then
                size="$(cat "$size_file")"
                size_mb="$(awk -v n="$size" 'BEGIN {printf "%.2f", n/1000000}')"
              fi

              [[ -f "$time_file" ]] && build_time="$(cat "$time_file")"

              echo "| $variant | $size | $size_mb | $build_time |"
            done

            echo
            echo "## 4. OS vulnerability results"
            echo
            echo "Counts are unique by vulnerability ID and package name."
            echo "Base means the runtime base image, not the build-stage image."
            echo
            echo "| Variant | Image | Severity | Total | Fix available | No fix available |"
            echo "|---|---|---|---:|---:|---:|"

            for variant in "${variants[@]}"; do
              for image_type in base final; do
                if [[ "$image_type" == "base" ]]; then
                  scan_file="result/raw/base-scans/${variant}.json"
                else
                  scan_file="result/raw/final-scans/${variant}.json"
                fi

                for severity in "${severities[@]}"; do
                  total="$(count_scan "$scan_file" os "$severity" all)"
                  available="$(count_scan "$scan_file" os "$severity" fix_available)"
                  unavailable="$(count_scan "$scan_file" os "$severity" no_fix_available)"

                  echo "| $variant | $image_type | $severity | $total | $available | $unavailable |"
                done
              done
            done

            echo
            echo "## 5. Production npm vulnerability results"
            echo
            echo "The same production-only package lockfile is used for all four variants."
            echo "Development dependencies are excluded."
            echo "These results describe application dependencies, not OS packages."
            echo
            echo "| Variant | Severity | Total | Fix available | No fix available |"
            echo "|---|---|---:|---:|---:|"

            for variant in "${variants[@]}"; do
              for severity in "${severities[@]}"; do
                total="$(count_scan result/raw/npm-production.json npm "$severity" all)"
                available="$(count_scan result/raw/npm-production.json npm "$severity" fix_available)"
                unavailable="$(count_scan result/raw/npm-production.json npm "$severity" no_fix_available)"

                echo "| $variant | $severity | $total | $available | $unavailable |"
              done
            done

            echo
            echo "## 6. Runtime usability"
            echo
            echo "| Variant | Shell | Bash | Package manager | Debug tools |"
            echo "|---|---|---|---|---|"

            for variant in "${variants[@]}"; do
              file="result/raw/inspection/${variant}-usability.txt"

              if [[ -f "$file" ]]; then
                shell_value="$(awk -F': ' '/^Shell:/ {print $2}' "$file")"
                bash_value="$(awk -F': ' '/^Bash:/ {print $2}' "$file")"
                package_value="$(awk -F': ' '/^Package manager:/ {print $2}' "$file")"
                debug_value="$(awk -F': ' '/^Debug tools:/ {print $2}' "$file")"

                echo "| $variant | $shell_value | $bash_value | $package_value | $debug_value |"
              else
                echo "| $variant | N/A | N/A | N/A | N/A |"
              fi
            done

            echo
            echo "## 7. Node versions"
            echo

            for variant in "${variants[@]}"; do
              file="result/raw/inspection/${variant}-node-version.txt"

              if [[ -f "$file" ]]; then
                echo "- $variant: $(cat "$file")"
              else
                echo "- $variant: N/A"
              fi
            done

            echo
            echo "## 8. Test validation"
            echo

            if [[ -f result/pre-ci-validation.txt ]]; then
              echo '```text'
              cat result/pre-ci-validation.txt
              echo '```'
            else
              echo "Local pre-CI validation artifact was not present in this workflow run."
            fi

            echo
            echo "## 9. Interpretation and limitations"
            echo
            echo "- Fix available means Trivy reports a non-empty FixedVersion. It does not mean the image already contains the fix."
            echo "- No fix available means Trivy did not report a FixedVersion for that finding."
            echo "- Vulnerability counts are unique by vulnerability ID and package name."
            echo "- The production npm scan uses a lockfile generated with --omit=dev."
            echo "- The npm scan is shared across variants because application dependencies are identical."
            echo "- Runtime usability checks inspect executable files and executable symbolic links in the final image filesystem."
            echo "- Shell is reported when a shell executable or BusyBox shell implementation is present."
            echo "- The base-image scan covers the runtime base image. It does not separately report vulnerabilities in builder-only images."
            echo "- Trivy results depend on the vulnerability database, package metadata and distribution advisories."
            echo "- CVE counts alone do not represent the complete security posture of an image."
            echo "- Build times and image sizes are environment-specific measurements."
            echo
            echo "## 10. Raw data"
            echo
            echo "Raw Trivy JSON scans, build timings, image metadata, filesystem inspection results and environment metadata are included in the result artifact."
          } > result/benchmark-summary.md

          # Preserve the existing Markdown report filename.
          cp result/benchmark-summary.md result/ci-results.md

          # General benchmark CSV.
          {
            echo "variant,image_size_bytes,image_size_mb,median_build_seconds"

            for variant in "${variants[@]}"; do
              size="N/A"
              build_time="N/A"
              size_mb="N/A"

              if [[ -f "result/raw/inspection/${variant}-size-bytes.txt" ]]; then
                size="$(cat "result/raw/inspection/${variant}-size-bytes.txt")"
                size_mb="$(awk -v n="$size" 'BEGIN {printf "%.2f", n/1000000}')"
              fi

              if [[ -f "result/raw/build-times/${variant}-median.txt" ]]; then
                build_time="$(cat "result/raw/build-times/${variant}-median.txt")"
              fi

              echo "${variant},${size},${size_mb},${build_time}"
            done
          } > result/ci-results.csv

          # Detailed vulnerability CSV.
          {
            echo "variant,image_type,package_type,severity,total,fix_available,no_fix_available"

            for variant in "${variants[@]}"; do
              for image_type in base final; do
                if [[ "$image_type" == "base" ]]; then
                  scan_file="result/raw/base-scans/${variant}.json"
                else
                  scan_file="result/raw/final-scans/${variant}.json"
                fi

                for severity in "${severities[@]}"; do
                  total="$(count_scan "$scan_file" os "$severity" all)"
                  available="$(count_scan "$scan_file" os "$severity" fix_available)"
                  unavailable="$(count_scan "$scan_file" os "$severity" no_fix_available)"

                  echo "${variant},${image_type},os,${severity},${total},${available},${unavailable}"
                done
              done

              for severity in "${severities[@]}"; do
                total="$(count_scan result/raw/npm-production.json npm "$severity" all)"
                available="$(count_scan result/raw/npm-production.json npm "$severity" fix_available)"
                unavailable="$(count_scan result/raw/npm-production.json npm "$severity" no_fix_available)"

                echo "${variant},final,npm,${severity},${total},${available},${unavailable}"
              done
            done
          } > result/trivy-results.csv

          echo "Benchmark reports generated."

      - name: Convert Markdown report to PDF
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f result/benchmark-summary.md ]]; then
            echo "Markdown report is not available; PDF generation skipped."
            exit 0
          fi

          python3 - <<'PY'
          from pathlib import Path
          from xml.sax.saxutils import escape
          import re
          import textwrap

          from reportlab.lib import colors
          from reportlab.lib.enums import TA_LEFT
          from reportlab.lib.pagesizes import A4, landscape
          from reportlab.lib.styles import ParagraphStyle
          from reportlab.lib.units import mm
          from reportlab.platypus import (
              SimpleDocTemplate,
              Paragraph,
              Spacer,
              Preformatted,
              LongTable,
              TableStyle,
          )

          source = Path("result/benchmark-summary.md")
          destination = Path("result/benchmark-summary.pdf")

          lines = source.read_text(encoding="utf-8").splitlines()

          page_width, _ = landscape(A4)

          doc = SimpleDocTemplate(
              str(destination),
              pagesize=landscape(A4),
              rightMargin=12 * mm,
              leftMargin=12 * mm,
              topMargin=13 * mm,
              bottomMargin=13 * mm,
              title="Docker Image Benchmark Report",
              author="Docker Benchmark CI",
          )

          title_style = ParagraphStyle(
              "ReportTitle",
              fontName="Helvetica-Bold",
              fontSize=18,
              leading=23,
              spaceAfter=12,
              textColor=colors.HexColor("#183153"),
          )

          heading_style = ParagraphStyle(
              "ReportHeading",
              fontName="Helvetica-Bold",
              fontSize=12,
              leading=16,
              spaceBefore=10,
              spaceAfter=6,
              textColor=colors.HexColor("#183153"),
          )

          body_style = ParagraphStyle(
              "ReportBody",
              fontName="Helvetica",
              fontSize=8,
              leading=11,
              spaceAfter=4,
              alignment=TA_LEFT,
          )

          table_header_style = ParagraphStyle(
              "TableHeader",
              fontName="Helvetica-Bold",
              fontSize=6.5,
              leading=8,
              textColor=colors.white,
          )

          table_cell_style = ParagraphStyle(
              "TableCell",
              fontName="Helvetica",
              fontSize=6.5,
              leading=8,
          )

          code_style = ParagraphStyle(
              "ReportCode",
              fontName="Courier",
              fontSize=6.2,
              leading=8,
              spaceAfter=5,
          )

          def markdown_to_reportlab(value):
              value = escape(value)
              value = re.sub(
                  r"\*\*(.+?)\*\*",
                  r"<b>\1</b>",
                  value
              )
              value = re.sub(
                  r"`([^`]+)`",
                  r'<font name="Courier">\1</font>',
                  value
              )
              return value

          def parse_table_row(line):
              return [
                  cell.strip()
                  for cell in line.strip().strip("|").split("|")
              ]

          def is_table_separator(line):
              cells = parse_table_row(line)

              if not cells:
                  return False

              return all(
                  re.fullmatch(r":?-{3,}:?", cell) is not None
                  for cell in cells
              )

          story = []
          index = 0
          in_code = False
          code_lines = []

          def flush_code():
              global code_lines

              if not code_lines:
                  return

              wrapped = []

              for line in code_lines:
                  wrapped.extend(
                      textwrap.wrap(
                          line,
                          width=150,
                          subsequent_indent="  ",
                          replace_whitespace=False,
                          drop_whitespace=False,
                      ) or [""]
                  )

              story.append(
                  Preformatted(
                      "\n".join(wrapped),
                      code_style
                  )
              )

              code_lines.clear()

          while index < len(lines):
              line = lines[index]

              if line.strip().startswith("```"):
                  if in_code:
                      flush_code()
                      in_code = False
                  else:
                      in_code = True

                  index += 1
                  continue

              if in_code:
                  code_lines.append(line)
                  index += 1
                  continue

              if not line.strip():
                  story.append(Spacer(1, 3))
                  index += 1
                  continue

              if line.startswith("|"):
                  table_lines = []

                  while index < len(lines) and lines[index].startswith("|"):
                      table_lines.append(lines[index])
                      index += 1

                  if len(table_lines) >= 2:
                      parsed_rows = [
                          parse_table_row(row)
                          for row in table_lines
                          if not is_table_separator(row)
                      ]

                      if parsed_rows:
                          column_count = max(
                              len(row) for row in parsed_rows
                          )

                          table_data = []

                          for row_number, row in enumerate(parsed_rows):
                              row = row + [""] * (
                                  column_count - len(row)
                              )

                              style = (
                                  table_header_style
                                  if row_number == 0
                                  else table_cell_style
                              )

                              table_data.append([
                                  Paragraph(
                                      markdown_to_reportlab(cell),
                                      style
                                  )
                                  for cell in row
                              ])

                          available_width = (
                              page_width
                              - doc.leftMargin
                              - doc.rightMargin
                          )

                          column_width = (
                              available_width / column_count
                          )

                          table = LongTable(
                              table_data,
                              colWidths=[
                                  column_width
                              ] * column_count,
                              repeatRows=1,
                              hAlign="LEFT",
                          )

                          table.setStyle(TableStyle([
                              ("BACKGROUND", (0, 0), (-1, 0),
                               colors.HexColor("#183153")),
                              ("TEXTCOLOR", (0, 0), (-1, 0),
                               colors.white),
                              ("GRID", (0, 0), (-1, -1),
                               0.35, colors.HexColor("#C8D0D9")),
                              ("VALIGN", (0, 0), (-1, -1),
                               "TOP"),
                              ("LEFTPADDING", (0, 0), (-1, -1), 4),
                              ("RIGHTPADDING", (0, 0), (-1, -1), 4),
                              ("TOPPADDING", (0, 0), (-1, -1), 3),
                              ("BOTTOMPADDING", (0, 0), (-1, -1), 3),
                              ("ROWBACKGROUNDS", (0, 1), (-1, -1), [
                                  colors.white,
                                  colors.HexColor("#F2F5F8"),
                              ]),
                          ]))

                          story.append(table)
                          story.append(Spacer(1, 7))

                  continue

              if line.startswith("# "):
                  story.append(
                      Paragraph(
                          markdown_to_reportlab(line[2:]),
                          title_style
                      )
                  )

              elif line.startswith("## "):
                  story.append(
                      Paragraph(
                          markdown_to_reportlab(line[3:]),
                          heading_style
                      )
                  )

              elif line.startswith("- "):
                  story.append(
                      Paragraph(
                          "&#8226; " + markdown_to_reportlab(line[2:]),
                          body_style
                      )
                  )

              else:
                  story.append(
                      Paragraph(
                          markdown_to_reportlab(line),
                          body_style
                      )
                  )

              index += 1

          if in_code:
              flush_code()

          def add_page_number(canvas, document):
              canvas.saveState()
              canvas.setFont("Helvetica", 7)
              canvas.setFillColor(colors.grey)

              canvas.drawRightString(
                  landscape(A4)[0] - 12 * mm,
                  7 * mm,
                  f"Page {document.page}",
              )

              canvas.restoreState()

          doc.build(
              story,
              onFirstPage=add_page_number,
              onLaterPages=add_page_number,
          )

          print(f"Created {destination}")
          PY

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-benchmark-results
          path: result/
          if-no-files-found: warn
          retention-days: 30
