name: Docker Benchmark CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Docker image benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y jq curl

          TRIVY_VERSION="0.69.3"

          curl -sfL \
            "https://raw.githubusercontent.com/aquasecurity/trivy/v${TRIVY_VERSION}/contrib/install.sh" \
            | sudo sh -s -- -b /usr/local/bin "v${TRIVY_VERSION}"

          docker --version
          trivy --version

      - name: Collect environment metadata
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p result/raw

          {
            echo "Benchmark date (UTC): $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Git commit: $(git rev-parse HEAD)"
            echo "Git branch: ${GITHUB_REF_NAME}"
            echo "Runner OS: ${RUNNER_OS}"
            echo "Runner architecture: $(uname -m)"
            echo "Docker version:"
            docker --version
            echo
            echo "Trivy version:"
            trivy --version
          } | tee result/raw/environment.txt

      - name: Download Trivy vulnerability database
        shell: bash
        run: |
          set -euo pipefail
          trivy image --download-db-only

      - name: Resolve and pull base images
        shell: bash
        run: |
          set -euo pipefail

          get_arg_value() {
            local dockerfile="$1"
            local arg_name="$2"

            awk -v wanted="$arg_name" '
              $1 == "ARG" {
                name = $2
                sub(/=.*/, "", name)

                if (name == wanted) {
                  value = $2
                  sub(/^[^=]*=/, "", value)
                  print value
                  exit
                }
              }
            ' "$dockerfile"
          }

          base_images_file="$(mktemp)"
          trap 'rm -f "$base_images_file"' EXIT

          for dockerfile in products-api/Dockerfile.*; do
            echo "Reading $dockerfile"

            node_image="$(get_arg_value "$dockerfile" NODE_IMAGE)"
            runtime_image="$(get_arg_value "$dockerfile" RUNTIME_IMAGE)"

            if [[ -n "$node_image" ]]; then
              echo "$node_image" >> "$base_images_file"
            fi

            if [[ -n "$runtime_image" ]]; then
              echo "$runtime_image" >> "$base_images_file"
            fi
          done

          sort -u "$base_images_file" -o "$base_images_file"

          while IFS= read -r image; do
            [[ -z "$image" ]] && continue

            echo "Pulling base image: $image"
            docker pull "$image"
          done < "$base_images_file"

          cp "$base_images_file" result/raw/base-images.txt

      - name: Scan base images
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p result/raw/base-scans

          get_arg_value() {
            local dockerfile="$1"
            local arg_name="$2"

            awk -v wanted="$arg_name" '
              $1 == "ARG" {
                name = $2
                sub(/=.*/, "", name)

                if (name == wanted) {
                  value = $2
                  sub(/^[^=]*=/, "", value)
                  print value
                  exit
                }
              }
            ' "$dockerfile"
          }

          for dockerfile in products-api/Dockerfile.*; do
            variant="${dockerfile##*.}"

            node_image="$(get_arg_value "$dockerfile" NODE_IMAGE)"
            runtime_image="$(get_arg_value "$dockerfile" RUNTIME_IMAGE)"

            if [[ -n "$runtime_image" ]]; then
              base_image="$runtime_image"
            else
              base_image="$node_image"
            fi

            echo "Scanning base image for $variant: $base_image"

            trivy image \
              --scanners vuln \
              --format json \
              --output "result/raw/base-scans/${variant}.json" \
              "$base_image"
          done

      - name: Build, scan and inspect images
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p result/raw/final-scans
          mkdir -p result/raw/build-times
          mkdir -p result/raw/inspection

          get_arg_value() {
            local dockerfile="$1"
            local arg_name="$2"

            awk -v wanted="$arg_name" '
              $1 == "ARG" {
                name = $2
                sub(/=.*/, "", name)

                if (name == wanted) {
                  value = $2
                  sub(/^[^=]*=/, "", value)
                  print value
                  exit
                }
              }
            ' "$dockerfile"
          }

          get_runtime_base() {
            local dockerfile="$1"
            local runtime_image

            runtime_image="$(get_arg_value "$dockerfile" RUNTIME_IMAGE)"

            if [[ -n "$runtime_image" ]]; then
              echo "$runtime_image"
            else
              get_arg_value "$dockerfile" NODE_IMAGE
            fi
          }

          summarize_scan() {
            local scan_file="$1"
            local package_class="$2"
            local severity="$3"
            local fixed_status="$4"

            jq -r \
              --arg package_class "$package_class" \
              --arg severity "$severity" \
              --arg fixed_status "$fixed_status" '
                [
                  .Results[]?.Vulnerabilities[]?
                  | select(
                      if $package_class == "os" then
                        .Class == "os-pkgs"
                      elif $package_class == "npm" then
                        .Type == "npm"
                      else
                        true
                      end
                    )
                  | select(
                      if $severity == "ALL" then
                        true
                      else
                        ((.Severity // "UNKNOWN") | ascii_upcase) == $severity
                      end
                    )
                  | select(
                      if $fixed_status == "fixed" then
                        ((.FixedVersion // "") != "")
                      elif $fixed_status == "unfixed" then
                        ((.FixedVersion // "") == "")
                      else
                        true
                      end
                    )
                  | {
                      id: (.VulnerabilityID // "UNKNOWN"),
                      package: (.PkgName // "UNKNOWN")
                    }
                ]
                | unique_by([.id, .package])
                | length
              ' "$scan_file"
          }

          variants=(alpine debian slim distroless)

          for variant in "${variants[@]}"; do
            dockerfile="products-api/Dockerfile.${variant}"
            image="products-api:${variant}"

            echo "========================================"
            echo "Benchmarking: $variant"
            echo "========================================"

            base_image="$(get_runtime_base "$dockerfile")"

            if [[ -z "$base_image" ]]; then
              echo "ERROR: Could not resolve runtime base image for $variant"
              exit 1
            fi

            echo "Runtime base image: $base_image"

            {
              echo "Variant: $variant"
              echo "Dockerfile: $dockerfile"
              echo "Runtime base image: $base_image"
              echo "Base image digest:"
              docker image inspect "$base_image" \
                --format '{{json .RepoDigests}}'
            } > "result/raw/inspection/${variant}-metadata.txt"

            # Build three times without using the build cache.
            for run in 1 2 3; do
              echo "Build $run/3: $variant"

              /usr/bin/time \
                -f "%e" \
                -o "result/raw/build-times/${variant}-${run}.txt" \
                docker build \
                  --no-cache \
                  --pull=false \
                  --file "$dockerfile" \
                  --tag "$image" \
                  products-api
            done

            median_time="$(
              cat "result/raw/build-times/${variant}-"*.txt \
                | sort -n \
                | sed -n '2p'
            )"

            echo "$median_time" \
              > "result/raw/build-times/${variant}-median.txt"

            # Scan final image.
            echo "Scanning final image: $image"

            trivy image \
              --scanners vuln \
              --format json \
              --output "result/raw/final-scans/${variant}.json" \
              "$image"

            # Smoke test.
            port="$((3100 + ${#variant}))"

            case "$variant" in
              alpine) port=3101 ;;
              debian) port=3102 ;;
              slim) port=3103 ;;
              distroless) port=3104 ;;
            esac

            bash scripts/smoke-test.sh "$image" "$port"

            # Inspect runtime filesystem.
            container="inspect-${variant}-${GITHUB_RUN_ID}"

            docker create \
              --name "$container" \
              "$image" >/dev/null

            docker export "$container" \
              | tar -tf - \
              > "result/raw/inspection/${variant}-filesystem.txt"

            docker rm "$container" >/dev/null

            filesystem="result/raw/inspection/${variant}-filesystem.txt"

            has_path() {
              local path="$1"
              grep -Eq "(^|/)${path}(/|$)" "$filesystem"
            }

            {
              echo "Variant: $variant"

              if has_path "sh"; then
                echo "Shell: yes"
              else
                echo "Shell: no"
              fi

              if has_path "bash"; then
                echo "Bash: yes"
              else
                echo "Bash: no"
              fi

              if has_path "apk" || has_path "apt" || has_path "apt-get" \
                || has_path "dpkg" || has_path "yum" \
                || has_path "microdnf"; then
                echo "Package manager: yes"
              else
                echo "Package manager: no"
              fi

              debug_tools=()

              for tool in curl wget busybox ping; do
                if has_path "$tool"; then
                  debug_tools+=("$tool")
                fi
              done

              if [[ ${#debug_tools[@]} -gt 0 ]]; then
                echo "Debug tools: ${debug_tools[*]}"
              else
                echo "Debug tools: none detected"
              fi
            } > "result/raw/inspection/${variant}-usability.txt"

            # Image size.
            docker image inspect "$image" \
              --format '{{.Size}}' \
              > "result/raw/inspection/${variant}-size-bytes.txt"

            # Record image details.
            {
              echo "Image: $image"
              echo "Image ID:"
              docker image inspect "$image" --format '{{.Id}}'
              echo "Repo digests:"
              docker image inspect "$image" \
                --format '{{join .RepoDigests ";"}}'
              echo "Image size (bytes):"
              cat "result/raw/inspection/${variant}-size-bytes.txt"
            } >> "result/raw/inspection/${variant}-metadata.txt"

            # Record Node version.
            if [[ "$variant" == "distroless" ]]; then
              node_binary="/nodejs/bin/node"
            else
              node_binary="/usr/local/bin/node"
            fi

            docker run --rm \
              --entrypoint "$node_binary" \
              "$image" \
              --version \
              > "result/raw/inspection/${variant}-node-version.txt"

            echo "Completed: $variant"
          done

      - name: Generate benchmark reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p result

          variants=(alpine debian slim distroless)
          severities=(CRITICAL HIGH MEDIUM LOW UNKNOWN)

          count_scan() {
            local file="$1"
            local package_class="$2"
            local severity="$3"
            local fixed_status="$4"

            if [[ ! -f "$file" ]]; then
              echo "N/A"
              return
            fi

            jq -r \
              --arg package_class "$package_class" \
              --arg severity "$severity" \
              --arg fixed_status "$fixed_status" '
                [
                  .Results[]?.Vulnerabilities[]?
                  | select(
                      if $package_class == "os" then
                        .Class == "os-pkgs"
                      elif $package_class == "npm" then
                        .Type == "npm"
                      else
                        true
                      end
                    )
                  | select(
                      if $severity == "ALL" then
                        true
                      else
                        ((.Severity // "UNKNOWN") | ascii_upcase) == $severity
                      end
                    )
                  | select(
                      if $fixed_status == "fixed" then
                        ((.FixedVersion // "") != "")
                      elif $fixed_status == "unfixed" then
                        ((.FixedVersion // "") == "")
                      else
                        true
                      end
                    )
                  | {
                      id: (.VulnerabilityID // "UNKNOWN"),
                      package: (.PkgName // "UNKNOWN")
                    }
                ]
                | unique_by([.id, .package])
                | length
              ' "$file"
          }

          {
            echo "# Docker Benchmark Results"
            echo
            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo
            echo "Git commit: $(git rev-parse HEAD)"
            echo
            echo "## Image sizes and build times"
            echo
            echo "| Variant | Image size (bytes) | Median build time (seconds) |"
            echo "|---|---:|---:|"

            for variant in "${variants[@]}"; do
              size_file="result/raw/inspection/${variant}-size-bytes.txt"
              time_file="result/raw/build-times/${variant}-median.txt"

              size="N/A"
              build_time="N/A"

              [[ -f "$size_file" ]] && size="$(cat "$size_file")"
              [[ -f "$time_file" ]] && build_time="$(cat "$time_file")"

              echo "| $variant | $size | $build_time |"
            done

            echo
            echo "## Vulnerability counts"
            echo
            echo "Counts are unique by vulnerability ID and package name."
            echo
            echo "| Image | Package type | Severity | Total | Fixed | Unfixed |"
            echo "|---|---|---|---:|---:|---:|"

            for variant in "${variants[@]}"; do
              for image_type in base final; do
                if [[ "$image_type" == "base" ]]; then
                  scan_file="result/raw/base-scans/${variant}.json"
                else
                  scan_file="result/raw/final-scans/${variant}.json"
                fi

                for package_class in os npm; do
                  for severity in "${severities[@]}"; do
                    total="$(count_scan "$scan_file" "$package_class" "$severity" all)"
                    fixed="$(count_scan "$scan_file" "$package_class" "$severity" fixed)"
                    unfixed="$(count_scan "$scan_file" "$package_class" "$severity" unfixed)"

                    echo "| $variant ($image_type) | $package_class | $severity | $total | $fixed | $unfixed |"
                  done
                done
              done
            done

            echo
            echo "## Runtime usability"
            echo
            echo "| Variant | Shell | Bash | Package manager | Debug tools |"
            echo "|---|---|---|---|---|"

            for variant in "${variants[@]}"; do
              file="result/raw/inspection/${variant}-usability.txt"

              if [[ -f "$file" ]]; then
                shell_value="$(awk -F': ' '/^Shell:/ {print $2}' "$file")"
                bash_value="$(awk -F': ' '/^Bash:/ {print $2}' "$file")"
                package_value="$(awk -F': ' '/^Package manager:/ {print $2}' "$file")"
                debug_value="$(awk -F': ' '/^Debug tools:/ {print $2}' "$file")"

                echo "| $variant | $shell_value | $bash_value | $package_value | $debug_value |"
              else
                echo "| $variant | N/A | N/A | N/A | N/A |"
              fi
            done

            echo
            echo "## Node versions"
            echo
            for variant in "${variants[@]}"; do
              file="result/raw/inspection/${variant}-node-version.txt"

              if [[ -f "$file" ]]; then
                echo "- $variant: $(cat "$file")"
              else
                echo "- $variant: N/A"
              fi
            done

            echo
            echo "## Notes"
            echo
            echo "- Build time is the median of three cache-disabled builds."
            echo "- Base images are pulled before build timing begins."
            echo "- Vulnerability counts are separated into OS packages and npm packages."
            echo "- Unknown severity findings are reported separately."
            echo "- Fixed and unfixed findings are distinguished using Trivy FixedVersion."
            echo "- Unit and E2E tests are run locally before pushing; they are not repeated in this workflow."
            echo "- Trivy findings depend on the vulnerability database and distribution advisories."
            echo "- CVE counts alone do not represent the complete security posture of an image."
          } > result/ci-results.md

          {
            echo "variant,image_size_bytes,median_build_seconds"
            for variant in "${variants[@]}"; do
              size="N/A"
              build_time="N/A"

              [[ -f "result/raw/inspection/${variant}-size-bytes.txt" ]] \
                && size="$(cat "result/raw/inspection/${variant}-size-bytes.txt")"

              [[ -f "result/raw/build-times/${variant}-median.txt" ]] \
                && build_time="$(cat "result/raw/build-times/${variant}-median.txt")"

              echo "${variant},${size},${build_time}"
            done
          } > result/ci-results.csv

          {
            echo "variant,image_type,package_type,severity,total,fixed,unfixed"
            for variant in "${variants[@]}"; do
              for image_type in base final; do
                if [[ "$image_type" == "base" ]]; then
                  scan_file="result/raw/base-scans/${variant}.json"
                else
                  scan_file="result/raw/final-scans/${variant}.json"
                fi

                for package_class in os npm; do
                  for severity in "${severities[@]}"; do
                    total="$(count_scan "$scan_file" "$package_class" "$severity" all)"
                    fixed="$(count_scan "$scan_file" "$package_class" "$severity" fixed)"
                    unfixed="$(count_scan "$scan_file" "$package_class" "$severity" unfixed)"

                    echo "${variant},${image_type},${package_class},${severity},${total},${fixed},${unfixed}"
                  done
                done
              done
            done
          } > result/trivy-results.csv

          echo "Reports generated."

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-benchmark-results
          path: result/
          if-no-files-found: warn
          retention-days: 30
